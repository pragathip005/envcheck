[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envcheck"
version = "0.1.0"
description = "An independent QC gate for RL training environments: audits task graders for hackability, judge bias, difficulty, and diversity before you train on them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["verifiers", "litellm", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
envcheck = "envcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["envcheck"]
